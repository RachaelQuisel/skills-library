interface:
  display_name: "Backfill Debrief Task Links"
  short_description: "Reconnect debrief tasks to meeting pages"
  default_prompt: "Use $backfill-debrief-task-links to safely reconnect meeting-created tasks for a named XRAY client."

dependencies:
