<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Fallback for web view */
        body {
            background-color: #fffaf0; /* floralwhite hex */
            color: #686f76;
            font-family: 'Figtree', sans-serif;
            margin: 0;
            padding: 48pt 16pt;
        }
        .container {
            max-width: 635pt; /* ~846px */
            margin: 0 auto;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12pt;
            margin: 24pt 0;
        }
    </style>
</head>
<body style="background-color: #fffaf0; color: #686f76; font-family: 'Figtree', sans-serif; padding: 48pt 16pt;">
    <div class="container" style="max-width: 635pt; margin: 0 auto;">
        {{content}}
    </div>
</body>
</html>
